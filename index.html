// ─── Phone layout ─────────────────────────────────────────────────────────────
// Rendered instead of the sidebar layout on screens ≤ 640 px: a slim top bar,
// a bottom tab bar, and a touch-first Today screen. The other screens are the
// shared components; data and actions are the same as on desktop (useDayLog).
const PHONE_QUERY = '(max-width: 640px)';
function useIsPhone() {
  const [m, setM] = useState(() => window.matchMedia(PHONE_QUERY).matches);
  useEffect(() => {
    const q = window.matchMedia(PHONE_QUERY), f = () => setM(q.matches);
    q.addEventListener('change', f); return () => q.removeEventListener('change', f);
  }, []);
  return m;
}

function PhoneIcon({ name }) {
  const p = { width: 24, height: 24, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' };
  if (name === 'today') return <svg {...p}><circle cx="12" cy="12" r="8" strokeOpacity="0.35" /><path d="M12 4a8 8 0 0 1 7.4 11" /></svg>;
  if (name === 'foods') return <svg {...p}><path d="M8 6h12M8 12h12M8 18h12" /><circle cx="4" cy="6" r="1" fill="currentColor" /><circle cx="4" cy="12" r="1" fill="currentColor" /><circle cx="4" cy="18" r="1" fill="currentColor" /></svg>;
  if (name === 'history') return <svg {...p}><rect x="3.5" y="5" width="17" height="15.5" rx="3" /><path d="M3.5 10h17M8.5 3v4M15.5 3v4" /></svg>;
  if (name === 'goals') return <svg {...p}><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="4" /><circle cx="12" cy="12" r="0.8" fill="currentColor" /></svg>;
  return <svg {...p}><path d="M6 8h11l-3-3M18 16H7l3 3" /></svg>;
}

const PHONE_TABS = [
  { id: 'dashboard', label: 'Today', icon: 'today' },
  { id: 'food', label: 'Foods', icon: 'foods' },
  { id: 'history', label: 'History', icon: 'history' },
  { id: 'goals', label: 'Goals', icon: 'goals' },
  { id: 'sync', label: 'Sync', icon: 'sync' },
];
const SYNC_SHORT = { off: 'Not synced', pending: 'Syncing…', saving: 'Saving…', ok: 'Saved', error: 'Not saved', conflict: 'Choose copy', newer: 'Update ready' };

function PhoneShell({ active, setActive, children }) {
  const s = useCloudSync();
  const status = CloudSync.info() ? s.status : 'off';
  function go(id) { setActive(id); window.scrollTo(0, 0); }
  return (
    <div className="phone-shell">
      <StorageBanner />
      <header className="phone-top">
        <div style={{ fontFamily: 'var(--mono)', fontWeight: 600, fontSize: 15, letterSpacing: -0.3 }}>MACRO<span style={{ color: 'var(--accent)' }}>LOG</span></div>
        <button className="tap-sm" onClick={() => go('sync')} title="GitHub sync"
          style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 999, padding: '5px 11px', fontSize: 12, color: 'var(--text2)' }}>
          <span style={{ width: 7, height: 7, borderRadius: '50%', background: SYNC_DOTS[status] || 'var(--amber)' }} />
          {SYNC_SHORT[status]}
        </button>
      </header>
      <main className="phone-main">{children}</main>
      <nav className="phone-tabs">
        {PHONE_TABS.map(t => (
          <button key={t.id} className={active === t.id ? 'on' : ''} onClick={() => go(t.id)} aria-label={t.label} aria-current={active === t.id ? 'page' : undefined}>
            <PhoneIcon name={t.icon} />{t.label}
          </button>
        ))}
      </nav>
    </div>
  );
}

function PhoneToday({ log, setLog, goals, foodDB, recipes, stocked, setStocked }) {
  const day = useDayLog(log, setLog);
  const { viewDate, setViewDate, isToday, meals, totals, timeline } = day;
  const [addSlot, setAddSlot] = useState(null);     // slot the Add sheet opens on
  const [picked, setPicked] = useState(null);       // { time, idx } of the tapped food
  const [showGrocery, setShowGrocery] = useState(false);
  const processed = processedSugarTotal(meals, foodDB);
  const remaining = goals.cal - totals.cal;
  const shortDate = new Date(viewDate + 'T00:00:00').toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
  const pickedMeal = picked && meals.find(m => m.time === picked.time);
  const pickedItem = pickedMeal && pickedMeal.items[picked.idx];
  const pm = pickedItem ? (pickedItem.qty_mult !== undefined ? pickedItem.qty_mult : 1) : 1;
  const navBtn = { width: 44, height: 44, borderRadius: 12, border: '1px solid var(--border)', background: 'var(--surface)', fontSize: 22, color: 'var(--text2)', flexShrink: 0 };
  const dot = k => <StatusDot status={macroStatus(k, totals[k], { processedSugar: processed })} />;
  const bars = [{ k: 'p', l: 'Protein', c: 'var(--accent)' }, { k: 'c', l: 'Carbs', c: '#b85c00' }, { k: 'fat', l: 'Fat', c: '#6b6b63' }];
  const itemCount = meals.reduce((a, m) => a + m.items.length, 0);

  return (
    <div style={{ padding: '12px 14px 0' }}>
      {/* Date */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <button className="tap-sm" style={navBtn} onClick={() => day.shiftDay(-1)} aria-label="Previous day">‹</button>
        <label style={{ flex: 1, position: 'relative', textAlign: 'center', padding: '2px 0' }}>
          <div style={{ fontSize: 11, fontFamily: 'var(--mono)', textTransform: 'uppercase', letterSpacing: 1, color: isToday ? 'var(--text3)' : 'var(--accent)' }}>{day.relLabel(viewDate)}</div>
          <div style={{ fontSize: 18, fontWeight: 600, marginTop: 1 }}>{shortDate} <span style={{ fontSize: 12, color: 'var(--text3)' }}>▾</span></div>
          <input type="date" value={viewDate} aria-label="Pick a date" onChange={e => { if (e.target.value) setViewDate(e.target.value); }}
            style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: 0, border: 'none' }} />
        </label>
        <button className="tap-sm" style={navBtn} onClick={() => day.shiftDay(1)} aria-label="Next day">›</button>
      </div>
      {!isToday && (
        <div style={{ textAlign: 'center', marginTop: 8 }}>
          <button className="p-chip tap-sm" onClick={() => setViewDate(todayKey())} style={{ color: 'var(--accent)', borderColor: 'var(--accent-dim)', background: 'var(--accent-bg)', fontWeight: 600 }}>Back to today</button>
        </div>
      )}

      {/* Summary */}
      <div className="p-card" style={{ marginTop: 12, padding: 14, display: 'flex', gap: 14, alignItems: 'center' }}>
        <div style={{ flexShrink: 0 }}><CalRing value={totals.cal} target={goals.cal} size={108} /></div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
            <span style={{ fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 0.6 }}>{remaining >= 0 ? 'Left today' : 'Over'}</span>
            <span style={{ fontFamily: 'var(--mono)', fontSize: 19, fontWeight: 600, color: remaining < 0 ? 'var(--red)' : 'var(--text)' }}>
              {r1(Math.abs(remaining))}<span style={{ fontSize: 11, fontWeight: 400, color: 'var(--text3)' }}> kcal</span>
            </span>
          </div>
          {bars.map(b => (
            <div key={b.k} style={{ marginTop: 9 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, marginBottom: 4 }}>
                <span style={{ display: 'flex', alignItems: 'center', gap: 6, color: 'var(--text2)' }}>{dot(b.k)}{b.l}</span>
                <span style={{ fontFamily: 'var(--mono)', fontWeight: 600 }}>{r1(totals[b.k])}<span style={{ fontWeight: 400, color: 'var(--text3)' }}> / {goals[b.k]} g</span></span>
              </div>
              <MiniBar value={totals[b.k]} target={goals[b.k]} color={b.c} height={6} />
            </div>
          ))}
        </div>
      </div>
      <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
        {[{ k: 'f', l: 'Fiber' }, { k: 's', l: 'Sugar' }].map(x => (
          <div key={x.k} className="p-card" style={{ flex: 1, padding: '9px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: 12, boxShadow: 'none' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6, color: 'var(--text2)' }}>{dot(x.k)}{x.l}</span>
            <span style={{ fontFamily: 'var(--mono)', fontWeight: 600 }}>{r1(totals[x.k])}<span style={{ fontWeight: 400, color: 'var(--text3)' }}> / {goals[x.k]} g</span></span>
          </div>
        ))}
      </div>

      {/* Day actions */}
      {itemCount > 0 && (
        <div style={{ display: 'flex', gap: 8, marginTop: 12, alignItems: 'center' }}>
          <button className="p-chip tap-sm" onClick={() => setShowGrocery(true)}>🛒 Grocery list</button>
          <span style={{ flex: 1 }} />
          <button className="p-chip tap-sm" onClick={day.clearDay} style={{ color: 'var(--text2)' }}>Clear day</button>
        </div>
      )}

      {/* Meals by time slot */}
      <div style={{ marginTop: 12, display: 'flex', flexDirection: 'column', gap: 10 }}>
        {timeline.map(entry => {
          const meal = entry.meal;
          if (!meal) return (
            <button key={entry.time} className="p-row tap-sm" onClick={() => setAddSlot(entry.time)}
              style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 14px', border: '1px dashed var(--border)', borderRadius: 14, background: 'transparent', textAlign: 'left' }}>
              <span style={{ fontFamily: 'var(--mono)', fontSize: 13, fontWeight: 600, color: 'var(--text3)', width: 52 }}>{entry.label}</span>
              <span style={{ flex: 1, fontSize: 13, color: 'var(--text3)' }}>Add food</span>
              <span style={{ fontSize: 20, color: 'var(--accent)', lineHeight: 1 }}>+</span>
            </button>
          );
          const t = sumMeals([meal]);
          return (
            <div key={entry.time} className="p-card" style={{ overflow: 'hidden' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 8px 8px 14px', background: 'var(--surface2)', borderBottom: '1px solid var(--border)' }}>
                <span style={{ fontFamily: 'var(--mono)', fontSize: 13, fontWeight: 700, color: 'var(--accent)' }}>{entry.label}</span>
                <span style={{ flex: 1, fontFamily: 'var(--mono)', fontSize: 11.5, color: 'var(--text2)' }}>{r1(t.cal)} kcal · P {r1(t.p)} g</span>
                <button className="tap-sm" onClick={() => setAddSlot(entry.time)} aria-label={`Add food at ${entry.label}`}
                  style={{ width: 36, height: 36, borderRadius: 10, border: 'none', background: 'var(--accent-bg)', color: 'var(--accent)', fontSize: 22, lineHeight: 1 }}>+</button>
              </div>
              {meal.items.map((item, ii) => {
                const mult = item.qty_mult !== undefined ? item.qty_mult : 1;
                return (
                  <button key={ii} className="p-row tap-sm" onClick={() => setPicked({ time: entry.time, idx: ii })}
                    style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%', padding: '11px 14px', background: 'none', border: 'none', borderTop: ii ? '1px solid var(--border)' : 'none', textAlign: 'left', color: 'var(--text)' }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 14.5, lineHeight: 1.3 }}>{item.name}</div>
                      <div style={{ fontSize: 11.5, color: 'var(--text3)', fontFamily: 'var(--mono)', marginTop: 3 }}>
                        {item.qty || item.portion}{item._batchServings ? ` · 1/${item._batchServings}` : ''} · P {r1(item.p * mult)} · C {r1(item.c * mult)} · F {r1(item.fat * mult)}
                      </div>
                    </div>
                    <div style={{ fontFamily: 'var(--mono)', fontWeight: 600, fontSize: 14, whiteSpace: 'nowrap' }}>{r1(item.cal * mult)}<span style={{ fontWeight: 400, fontSize: 10.5, color: 'var(--text3)' }}> kcal</span></div>
                  </button>
                );
              })}
            </div>
          );
        })}
      </div>
      <div style={{ textAlign: 'center', fontSize: 11.5, color: 'var(--text3)', margin: '14px 0 4px' }}>Tap a food to move it to another time or remove it.</div>

      <button className="fab tap-sm" aria-label="Add food" onClick={() => setAddSlot(nearestSlot())}>+</button>

      {/* Tapped food: move or remove */}
      {pickedItem && (
        <div className="modal-wrap" onClick={e => e.target === e.currentTarget && setPicked(null)}
          style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', zIndex: 1200, display: 'flex', alignItems: 'flex-end' }}>
          <div className="modal-box" role="dialog" aria-label="Food actions" style={{ background: 'var(--surface)', padding: '10px 16px 16px', width: '100%' }}>
            <div style={{ width: 40, height: 5, borderRadius: 3, background: 'var(--border)', margin: '0 auto 12px' }} />
            <div style={{ fontSize: 16, fontWeight: 600 }}>{pickedItem.name}</div>
            <div style={{ fontSize: 12.5, color: 'var(--text2)', fontFamily: 'var(--mono)', marginTop: 3 }}>
              {pickedItem.qty || pickedItem.portion} · {r1(pickedItem.cal * pm)} kcal · now at {formatSlot(picked.time)}
            </div>
            <div style={{ fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 0.6, margin: '16px 0 8px' }}>Move to</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
              {MEAL_SLOTS.map(sl => {
                const here = sl.value === picked.time;
                return (
                  <button key={sl.value} disabled={here} onClick={() => { day.moveItem(picked.time, picked.idx, sl.value); setPicked(null); }}
                    style={{ height: 44, borderRadius: 10, fontFamily: 'var(--mono)', fontSize: 13, fontWeight: 600,
                      border: `1px solid ${here ? 'var(--accent)' : 'var(--border)'}`, background: here ? 'var(--accent-bg)' : 'var(--bg)', color: here ? 'var(--accent)' : 'var(--text)' }}>
                    {sl.label}
                  </button>
                );
              })}
            </div>
            <button onClick={() => { day.removeItem(meals.indexOf(pickedMeal), picked.idx); setPicked(null); }}
              style={{ width: '100%', height: 48, marginTop: 16, borderRadius: 12, border: '1px solid var(--red)', background: 'var(--red-bg)', color: 'var(--red)', fontSize: 15, fontWeight: 600 }}>
              Remove from log
            </button>
            <button onClick={() => setPicked(null)}
              style={{ width: '100%', height: 48, marginTop: 8, borderRadius: 12, border: '1px solid var(--border)', background: 'var(--surface)', fontSize: 15 }}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {addSlot && <AddMealModal initialSlot={addSlot} onAdd={day.addEntry} onClose={() => setAddSlot(null)} foodDB={foodDB} recipes={recipes} />}
      {showGrocery && window.GroceryList && <window.GroceryList meals={meals} foodDB={foodDB} stocked={stocked} setStocked={setStocked} dateKey={day.key} onClose={() => setShowGrocery(false)} />}
    </div>
  );
}

// ─── App Root ─────────────────────────────────────────────────────────────────
function App() {
  const [active, setActive] = useState('dashboard');
  const [log, setLog] = useLS('macrolog_v1', {});
  const [goals, setGoals] = useLS('macrogoals_v1', DEFAULT_GOALS);
  const [foodDB, setFoodDB] = useLS('macrofooddb_v1', FOOD_DB);
  const [recipesRaw, setRecipes] = useLS('macrorecipes_v1', RECIPES);
  // Meal totals are derived live from the ingredient database, so an ingredient
  // correction propagates into every meal that references it.
  const recipes = useMemo(() => recipesRaw.map(r =>
    Array.isArray(r.lineItems) && r.lineItems.length ? { ...r, ...sumLineItems(r.lineItems, foodDB) } : r
  ), [recipesRaw, foodDB]);
  const [stocked, setStocked] = useLS('macrostocked_v1', []);
  const { useTweaks, TweaksPanel, TweakSection, TweakColor, TweakToggle } = window;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accentColor": "#00895a",
    "monoFont": true,
    "compactNumbers": false
  }/*EDITMODE-END*/;

  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accentColor);
  }, [tweaks.accentColor]);

  useEffect(() => { CloudSync.start(); }, []);

  const todayMeals = log[todayKey()] || [];
  const totals = sumMeals(todayMeals);
  const phone = useIsPhone();

  if (phone) return (
    <PhoneShell active={active} setActive={setActive}>
      {active === 'dashboard' && <PhoneToday log={log} setLog={setLog} goals={goals} foodDB={foodDB} recipes={recipes} stocked={stocked} setStocked={setStocked} />}
      {active === 'food'      && <FoodDatabase phone foodDB={foodDB} setFoodDB={setFoodDB} recipes={recipes} setRecipes={setRecipes} />}
      {active === 'history'   && <History log={log} goals={goals} setLog={setLog} />}
      {active === 'goals'     && <Goals goals={goals} setGoals={setGoals} />}
      {active === 'sync'      && <SyncScreen />}
    </PhoneShell>
  );

  return (
    <div className="app-shell" style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      <StorageBanner />
      <Sidebar active={active} setActive={setActive} totals={totals} goals={goals} />
      <main className="app-main" style={{ flex: 1, overflowY: 'auto', background: 'var(--bg)' }}>
        {active === 'dashboard' && <Dashboard log={log} goals={goals} setLog={setLog} foodDB={foodDB} recipes={recipes} stocked={stocked} setStocked={setStocked} />}
        {active === 'food'      && <FoodDatabase foodDB={foodDB} setFoodDB={setFoodDB} recipes={recipes} setRecipes={setRecipes} />}
        {active === 'history'   && <History log={log} goals={goals} setLog={setLog} />}
        {active === 'goals'     && <Goals goals={goals} setGoals={setGoals} />}
        {active === 'sync'      && <SyncScreen />}
      </main>
      <TweaksPanel>
        <TweakSection label="Appearance">
          <TweakColor id="accentColor" label="Accent Color" tweaks={tweaks} setTweak={setTweak} />
          <TweakToggle id="monoFont" label="Monospace numbers" tweaks={tweaks} setTweak={setTweak} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
