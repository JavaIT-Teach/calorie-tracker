<script>
// ─── StorageGuard: every app read/write of localStorage goes through here ────
// A key that fails to read (invalid JSON or blocked storage) is marked
// unreadable: its raw value is left untouched and every write to it is refused
// for the rest of the page session, so state built from a fallback can never
// overwrite the real data. Reload after the value is fixed. A failed write
// (e.g. storage full) is recorded instead of thrown. The app shows a banner
// for both (StorageBanner).
window.StorageGuard = (function () {
  const unreadable = new Set();
  const saveErrors = new Map();
  const listeners = new Set();
  // Deferred so a read during a component's render never updates another
  // component mid-render.
  const notify = () => setTimeout(() => listeners.forEach(fn => fn()), 0);

  function read(key, def) {
    let raw;
    try { raw = localStorage.getItem(key); }
    catch (e) { unreadable.add(key); notify(); console.warn(`Storage blocked; ${key} not read`, e); return def; }
    if (raw == null) return def;
    try { return JSON.parse(raw); }
    catch (e) { unreadable.add(key); notify(); console.warn(`${key} holds invalid JSON; left untouched`, e); return def; }
  }

  function write(key, value) {
    if (unreadable.has(key)) return false; // paused: never overwrite data we failed to read
    try {
      localStorage.setItem(key, JSON.stringify(value));
      if (saveErrors.delete(key)) notify();
      if (window.CloudSync) CloudSync.changed(key); // queue a save to GitHub (sync.js)
      return true;
    } catch (e) {
      saveErrors.set(key, e && e.message || String(e));
      notify();
      console.warn(`Saving ${key} failed`, e);
      return false;
    }
  }

  function status() { return { unreadable: [...unreadable], saveErrors: [...saveErrors.keys()] }; }
  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  return { read, write, status, subscribe };
})();

// ─── Data safety: backup → seed fill → migrations ─────────────────────────────
// Data saved from the app is the source of truth; a code deploy must never
// overwrite it (rules in CLAUDE.md). On every load, if there is pending work:
//   1. Snapshot every macro* localStorage key to BACKUP_KEY. If that fails,
//      nothing below runs.
//   2. Seed fill: add each seed food/recipe from data.js whose ID has never been
//      offered before (tracked in SEEDED_KEY) and is not already stored. Stored
//      items are never changed, and seed items the user deleted stay deleted.
//   3. Run each migration whose version flag is not 'done'.
//
// The previous 15 one-time migrations (migration_rice_cakes_v1 …
// migration_bran_bread_lunch_v1) replaced stored values, so they were retired.
// Their end state for new installs now lives in the seed data.
(function protectAndUpgradeData() {
  const BACKUP_KEY = 'macrobackup_v1';
  const SEEDED_KEY = 'macroseeded_v1';

  // Each migration: { id: 'migration_<name>_v1', run() }. A migration may only
  // add missing items or fix broken fields — never replace a value the user
  // could have edited. It must be idempotent: a failed run is retried on the
  // next load. Never reuse or rename an id; bump the version for a new one.
  const MIGRATIONS = [
    // Beef lunches + matching Julien wraps (owner request, 2026-10-17).
    // Add-only: clones the user's *stored* recipes so their stored ingredient
    // values and amounts are used; only the protein/mushroom lines differ.
    // Never edits or removes an existing food or recipe; skips anything whose
    // source is missing or whose new ID or name already exists.
    { id: 'migration_beef_lunch_wraps_v1', run() {
      const foods = readJSON('macrofooddb_v1', []);
      const recipes = readJSON('macrorecipes_v1', []);
      if (!Array.isArray(foods) || !Array.isArray(recipes)) throw new Error('food or recipe store is not a list');
      const newLineId = foodId => foodId + '_' + Math.random().toString(36).slice(2, 8);
      const has = (list, id, name) => list.some(x => x.id === id || (name && String(x.name).trim() === name));

      // 1. Ground Beef 80/20 (raw): reuse an existing 80/20 beef entry, else add it.
      let beef = foods.find(f => f.id === 'ground_beef_80_20' || (/beef/i.test(f.name) && /80\s*\/\s*20/.test(f.name)));
      let foodsChanged = false;
      if (!beef) {
        beef = { id: 'ground_beef_80_20', name: 'Ground Beef 80/20 (raw)', portion: '100 g', cal: 254, p: 17.2, c: 0, f: 0, s: 0, fat: 20 };
        foods.push(beef);
        foodsChanged = true;
      }

      const gramsLine = (food, grams, prev) => ({
        id: newLineId(food.id), foodId: food.id, foodName: prev ? prev.foodName : food.name,
        foodPortion: food.portion, enteredQty: grams, unit: 'g', mult: grams / splitPortion(food.portion).qty,
      });
      const lineFor = (items, foodId, name) => {
        const hits = items.filter(l => l.foodId === foodId || l.foodName === name);
        return hits.length === 1 ? hits[0] : null;
      };
      const added = [];
      // Clone src, swapping the given lines; everything else keeps its exact amount.
      function cloneRecipe(src, id, name, swaps) {
        if (!src || !Array.isArray(src.lineItems)) return console.warn(`Source for "${name}" not found; skipped`);
        if (has(recipes, id, name)) return; // already there: never overwrite
        const targets = swaps.map(s => ({ ...s, line: lineFor(src.lineItems, s.foodId, s.name) }));
        if (targets.some(t => !t.line)) return console.warn(`"${src.name}" has no single line for ${targets.filter(t => !t.line).map(t => t.name)}; "${name}" skipped`);
        const lineItems = src.lineItems.map(l => {
          const t = targets.find(t => t.line === l);
          if (!t) return { ...l, id: newLineId(l.foodId) };
          const food = foods.find(f => f.id === (t.toFood || l.foodId));
          return gramsLine(food, t.grams, t.toFood ? null : l);
        });
        const { id: _id, name: _name, lineItems: _li, ...rest } = src;
        recipes.push({ ...rest, id, name, lineItems, ...sumLineItems(lineItems, foods) });
        added.push(name);
      }

      // 2. Beef lunches: same carb and bread amounts as the thigh lunch.
      const byIdOrName = (id, name) => recipes.find(r => r.id === id) || recipes.find(r => String(r.name).trim() === name);
      const THIGH = { foodId: 'chicken_thighs', name: 'Chicken Thigh (bone-in, raw)', toFood: beef.id };
      for (const [week, grams] of [['Pasta', 200], ['Potato', 235], ['Rice', 225]]) {
        const w = week.toLowerCase();
        cloneRecipe(byIdOrName(`lunch_${w}_week`, `Lunch — ${week} Week (thigh)`),
          `lunch_${w}_week_beef`, `Lunch — ${week} Week (beef)`, [{ ...THIGH, grams }]);
      }

      // 3. Julien Style Wrap variants: only chicken and mushrooms change.
      const julien = recipes.find(r => String(r.name).trim() === 'Julien Style Wrap');
      for (const [week, chicken] of [['Pasta', 318], ['Potato', 332], ['Rice', 358]]) {
        cloneRecipe(julien, `julien_wrap_${week.toLowerCase()}_week_beef`, `Julien Style Wrap — ${week} Week (beef lunch)`, [
          { foodId: 'chicken_breast', name: 'Chicken Breast (raw, b/s)', grams: chicken },
          { foodId: 'mushrooms', name: 'Mushrooms (raw, white button)', grams: 80 },
        ]);
      }

      if (foodsChanged) localStorage.setItem('macrofooddb_v1', JSON.stringify(foods));
      if (added.length) localStorage.setItem('macrorecipes_v1', JSON.stringify(recipes));
      console.info('migration_beef_lunch_wraps_v1 added:', foodsChanged ? 'Ground Beef 80/20 (raw),' : '', added.join(', ') || 'no recipes');
    } },
  ];

  // Throws on unreadable JSON so callers can leave that key untouched.
  function readJSON(key, def) {
    const raw = localStorage.getItem(key);
    return raw == null ? def : JSON.parse(raw);
  }

  const SEED_STORES = [
    { key: 'macrofooddb_v1',  field: 'foods',   seeds: FOOD_DB },
    { key: 'macrorecipes_v1', field: 'recipes', seeds: RECIPES },
  ];

  let seeded;
  try { seeded = readJSON(SEEDED_KEY, {}) || {}; } catch (e) { seeded = {}; }
  const pendingSeeds = SEED_STORES.some(s => s.seeds.some(x => !(seeded[s.field] || []).includes(x.id)));
  const pendingMigrations = MIGRATIONS.filter(m => localStorage.getItem(m.id) !== 'done');
  if (!pendingSeeds && pendingMigrations.length === 0) return;
  window.__ctLoadChanged = true; // tells sync.js this load may add data to send

  // Unreadable data: keep the last good backup and change nothing this load.
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k.startsWith('macro') || k === BACKUP_KEY) continue;
    try { JSON.parse(localStorage.getItem(k)); }
    catch (e) { console.warn(`${k} is unreadable; skipping backup, seed fill and migrations`); return; }
  }

  // 1. Backup
  try {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith('macro') && k !== BACKUP_KEY) data[k] = localStorage.getItem(k);
    }
    localStorage.setItem(BACKUP_KEY, JSON.stringify({ savedAt: new Date().toISOString(), data }));
  } catch (e) {
    console.warn('Data backup failed; skipping seed fill and migrations', e);
    return;
  }

  // 2. Seed fill
  for (const s of SEED_STORES) {
    let list;
    try { list = readJSON(s.key, []); } catch (e) { list = null; }
    if (!Array.isArray(list)) { console.warn(`${s.key} is unreadable; left untouched`); continue; }
    const stored = new Set(list.map(x => x && x.id));
    const offered = new Set(seeded[s.field] || []);
    let added = false;
    for (const seed of s.seeds) {
      if (offered.has(seed.id)) continue;
      offered.add(seed.id);
      if (stored.has(seed.id)) continue; // stored version wins
      const copy = JSON.parse(JSON.stringify(seed));
      if (Array.isArray(copy.lineItems)) {
        copy.lineItems = copy.lineItems.map(l => ({ ...l, id: l.foodId + '_' + Math.random().toString(36).slice(2, 8) }));
      }
      list.push(copy);
      added = true;
    }
    try {
      if (added) localStorage.setItem(s.key, JSON.stringify(list));
      seeded[s.field] = [...offered];
    } catch (e) { console.warn(`Seed fill for ${s.key} failed`, e); }
  }
  try { localStorage.setItem(SEEDED_KEY, JSON.stringify(seeded)); } catch (e) { console.warn('Could not save seed record', e); }

  // 3. Migrations
  for (const m of pendingMigrations) {
    try { m.run(); localStorage.setItem(m.id, 'done'); }
    catch (e) { console.warn(`Migration ${m.id} failed; will retry next load`, e); }
  }
})();
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ─── Storage ──────────────────────────────────────────────────────────────────
// Reads and writes go through StorageGuard: an unreadable key falls back to
// `def` in memory only and is never written back; a failed save shows a banner.
function useLS(key, def) {
  const [val, setVal] = useState(() => StorageGuard.read(key, def));
  const set = useCallback(v => {
    setVal(prev => {
      const next = typeof v === 'function' ? v(prev) : v;
      StorageGuard.write(key, next);
      return next;
    });
  }, [key]);
  return [val, set];
}

// ─── StorageBanner ────────────────────────────────────────────────────────────
const STORAGE_LABELS = {
  macrolog_v1: 'Meal log', macrogoals_v1: 'Goals', macrofooddb_v1: 'Foods',
  macrorecipes_v1: 'Recipes', macrostocked_v1: 'Stock marks',
  macrogrocery_checked_v1: 'Grocery check-offs', macrogrocery_custom_v1: 'Custom grocery items',
};
function StorageBanner() {
  const [st, setSt] = useState(() => StorageGuard.status());
  useEffect(() => {
    setSt(StorageGuard.status()); // catch anything recorded before subscribing
    return StorageGuard.subscribe(() => setSt(StorageGuard.status()));
  }, []);
  const sync = useCloudSync();
  const label = keys => keys.map(k => STORAGE_LABELS[k] || k).join(', ');
  const bar = (bg, border, color) => ({ background: bg, borderBottom: `1px solid ${border}`, color, padding: '10px 16px', fontSize: 13, lineHeight: 1.4 });
  const btn = primary => ({ marginLeft: 8, marginTop: 4, padding: '5px 12px', borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: 'pointer',
    border: `1px solid ${primary ? 'var(--accent)' : 'var(--border)'}`, background: primary ? 'var(--accent)' : 'var(--surface)', color: primary ? '#fff' : 'var(--text)' });
  const cf = sync.conflict;
  const when = iso => iso ? new Date(iso).toLocaleString('en-CA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'earlier';
  if (!st.unreadable.length && !st.saveErrors.length && !cf && !sync.newer) return null;
  return (
    <div role="alert" style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 5000, boxShadow: 'var(--shadow)' }}>
      {st.unreadable.length > 0 && (

          <b style={{ color: 'var(--amber)' }}>This device and GitHub both changed. Choose which copy to keep.</b>

            GitHub copy: saved {when(cf.remoteSavedAt)} · {cf.remoteDays} logged days. This device: edited {when(cf.localEditedAt)} · {cf.localDays} logged days. The copy you don't keep stays in GitHub's history or this device's backup.
          </div>
          <button style={btn(false)} onClick={() => CloudSync.resolve('github')}>Keep GitHub copy</button>
          <button style={btn(true)} onClick={() => CloudSync.resolve('local')}>Keep this device's copy</button>
        </div>
      )}
      {!cf && sync.newer && (
        <div style={bar('var(--accent-bg)', 'var(--accent-dim)', 'var(--text)')}>
          <b style={{ color: 'var(--accent)' }}>Updated on another device.</b>
          <span style={{ color: 'var(--text2)' }}> Load the newer copy from GitHub (saved {when(sync.newer.file.savedAt)}).</span>
          <button style={btn(true)} onClick={() => CloudSync.loadNewer()}>Load it</button>
        </div>
      )}
    </div>
  );
}

  const [st, setSt] = useState(() => CloudSync.state());
  useEffect(() => { setSt(CloudSync.state()); return CloudSync.subscribe(setSt); }, []);
  return st;
}

  error: 'Not saved to GitHub', conflict: 'Choose which copy to keep', newer: 'Newer copy on GitHub' };
const SYNC_DOTS = { ok: 'var(--accent)', error: 'var(--red)', conflict: 'var(--red)', off: 'var(--text3)' };
const clockTime = t => new Date(t).toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit' });

}

// ─── Meal time slots ─────────────────────────────────────────────────────────
// Fixed daily eating windows. Stored as 24h "HH:00" so existing sort/match logic still works.
const MEAL_SLOTS = [
  { value: '08:00', label: '8 am' },
  { value: '10:00', label: '10 am' },
  { value: '11:00', label: '11 am' },
  { value: '13:00', label: '1 pm' },
  { value: '15:00', label: '3 pm' },
  { value: '17:00', label: '5 pm' },
  { value: '20:00', label: '8 pm' },
];
function formatSlot(time) {
  const slot = MEAL_SLOTS.find(s => s.value === time);
  if (slot) return slot.label;
  // Fallback for legacy entries logged before slots existed
  if (!time) return '';
  const [h, m] = time.split(':').map(Number);
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = ((h + 11) % 12) + 1;
  return m ? `${h12}:${String(m).padStart(2,'0')} ${ampm}` : `${h12} ${ampm}`;
}
function nearestSlot() {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  let best = MEAL_SLOTS[0].value;
  let bestDiff = Infinity;
  for (const s of MEAL_SLOTS) {
    const [sh, sm] = s.value.split(':').map(Number);
    const diff = Math.abs(sh * 60 + sm - mins);
    if (diff < bestDiff) { bestDiff = diff; best = s.value; }
  }
  return best;
}

// ─── parsePortion ─────────────────────────────────────────────────────────────
// "100 g" → { baseQty: 100, unit: "g" }
// "1 pc"  → { baseQty: 1,   unit: "pc" }
// "2 tbsp"→ { baseQty: 2,   unit: "tbsp" }
function parsePortion(portion) {
  if (!portion) return { baseQty: 1, unit: '' };
  const m = String(portion).match(/^([\d.]+)\s*(.+?)(\s*\(.*\))?$/);
  if (m) return { baseQty: parseFloat(m[1]) || 1, unit: m[2].trim() };
  return { baseQty: 1, unit: portion };
}

// ─── MiniBar ─────────────────────────────────────────────────────────────────
function MiniBar({ value, target, color = 'var(--accent)', height = 5 }) {
  const pct = Math.min(100, target > 0 ? (value / target) * 100 : 0);
  const over = value > target && target > 0;
  return (
    <div style={{ background: 'var(--border)', borderRadius: 99, height, overflow: 'hidden', flexShrink: 0 }}>
      <div style={{
        width: `${pct}%`, height: '100%',
        background: over ? 'var(--red)' : color,
        borderRadius: 99, transition: 'width 0.3s ease'
      }} />
    </div>
  );
}

// ─── StatusDot ────────────────────────────────────────────────────────────────
// Green / yellow / red range status, using the same dot convention as the
// history calendar.
function StatusDot({ status, size = 7 }) {
  const label = { green: 'In range', yellow: 'Borderline', red: 'Out of range' }[status] || '';
  return <span title={label} style={{ width: size, height: size, borderRadius: '50%', background: STATUS_COLOR[status], display: 'inline-block', flexShrink: 0 }} />;
}

// ─── MacroTable ───────────────────────────────────────────────────────────────
function MacroTable({ totals, goals, processedSugar = 0 }) {
  const rows = [
    { key: 'cal',  label: 'Calories', unit: 'kcal', color: '#1a6bb5' },
    { key: 'p',    label: 'Protein',  unit: 'g',    color: 'var(--accent)' },
    { key: 'c',    label: 'Carbs',    unit: 'g',    color: '#b85c00' },
    { key: 'f',    label: 'Fiber',    unit: 'g',    color: '#6a5acd' },
    { key: 's',    label: 'Sugars',   unit: 'g',    color: '#c0396b' },
    { key: 'fat',  label: 'Fat',      unit: 'g',    color: '#6b6b63' },
  ];
  return (
    <div style={{ width: '100%' }}>
      {rows.map(r => {
        const val = totals[r.key] || 0;
        const tgt = goals[r.key] || 0;
        const rem = tgt - val;
        const over = val > tgt && tgt > 0;
        const status = macroStatus(r.key, val, { processedSugar });
        return (
          <div key={r.key} className="macro-row" style={{ display: 'grid', gridTemplateColumns: '80px 1fr 70px 70px', gap: '0 12px', alignItems: 'center', padding: '7px 0', borderBottom: '1px solid var(--border)' }}>
            <span style={{ fontFamily: 'var(--sans)', fontSize: 12, color: 'var(--text2)', fontWeight: 500, display: 'flex', alignItems: 'center', gap: 6 }}><StatusDot status={status} />{r.label}</span>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
              <MiniBar value={val} target={tgt} color={r.color} height={4} />
            </div>
            <span style={{ fontFamily: 'var(--mono)', fontSize: 12, fontWeight: 600, color: STATUS_COLOR[status] === 'var(--accent)' ? 'var(--text)' : STATUS_COLOR[status], textAlign: 'right', whiteSpace: 'nowrap' }}>
              {r1(val)}<span style={{ fontWeight: 400, color: 'var(--text3)', fontSize: 11 }}> / {tgt}{r.unit === 'kcal' ? '' : ''}</span>
            </span>
            <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: over ? 'var(--red)' : rem < tgt * 0.1 ? 'var(--amber)' : 'var(--text2)', textAlign: 'right', whiteSpace: 'nowrap' }}>
              {over ? '+' : ''}{r1(over ? val - tgt : rem)}{r.unit === 'kcal' ? ' kcal' : 'g'}
            </span>
          </div>
        );
      })}
    </div>
  );
}

// ─── AddMealModal ─────────────────────────────────────────────────────────────
function AddMealModal({ onAdd, onClose, foodDB, recipes, initialSlot }) {
  const [tab, setTab] = useState('food'); // 'food' | 'recipe' | 'plan'
  const [search, setSearch] = useState('');
  const [time, setTime] = useState(() => initialSlot || nearestSlot());
  const [selected, setSelected] = useState(null);
  const [enteredQty, setEnteredQty] = useState(1);
  const [servings, setServings] = useState(1);

  const allItems = tab === 'food' ? foodDB : tab === 'recipe' ? recipes : null;
  const filtered = allItems ? allItems.filter(i => i.name.toLowerCase().includes(search.toLowerCase())) : [];

  // When a new item is selected, reset qty to its base portion amount
  const parsedPortion = selected ? parsePortion(selected.portion) : { baseQty: 1, unit: '' };

  // Weighable = grams or millilitres → adjust by raw weight, no servings divider
  const isWeighable = ['g', 'ml'].includes(parsedPortion.unit?.toLowerCase());

  useEffect(() => {
    if (selected) {
      setEnteredQty(parsedPortion.baseQty);
      setServings(1);
    }
  }, [selected?.id]);

  // For weighable items: mult = enteredGrams / baseGrams (ignore servings)
  // For count items:    mult = enteredQty / baseQty / servings
  const effectiveMult = isWeighable
    ? enteredQty / parsedPortion.baseQty
    : (enteredQty / parsedPortion.baseQty) / Math.max(servings, 1);
  const isBatch = !isWeighable && servings > 1;

  function confirm() {
    if (tab === 'plan' && selected) {
      onAdd({ plan: selected });
    } else if (selected) {
      const qtyLabel = `${enteredQty} ${parsedPortion.unit}`.trim();
      onAdd({
        time,
        items: [{
          ...selected,
          qty_mult: effectiveMult,
          qty: qtyLabel,
          _batchServings: (!isWeighable && servings > 1) ? servings : undefined
        }]
      });

    onClose();

        </div>

          {['food','recipe','plan'].map(t => (
            <button key={t} onClick={() => { setTab(t); setSelected(null); setSearch(''); }}
              style={{ flex: 1, padding: '10px 0', border: 'none', background: 'none', fontWeight: 500, fontSize: 13,

              <div className="slot-row" style={{ display: 'flex', gap: 6, marginTop: 10, alignItems: 'center', flexWrap: 'wrap' }}>

                      <div style={{ fontFamily: 'var(--mono)', fontSize: 14, fontWeight: 600 }}>{r1(val * effectiveMult)}</div>
                      <div style={{ fontSize: 9, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 0.4 }}>{label}</div>
                    </div>
                  ))}
                  <div style={{ marginLeft: 'auto', fontSize: 10, color: 'var(--text3)', fontFamily: 'var(--mono)', textAlign: 'right' }}>
                    base: {selected.cal} kcal / {parsedPortion.baseQty}{parsedPortion.unit}
                  </div>
                </div>
              </div>
            )}
          </>
        ) : (
          <div style={{ overflowY: 'auto', flex: 1 }}>
            {DIET_PLANS.map(plan => {
              const t = sumMeals(plan.meals);
              return (
                <div key={plan.id} onClick={() => setSelected(plan)}
                  style={{ padding: '14px 16px', cursor: 'pointer', borderBottom: '1px solid var(--border)',
                    background: selected?.id === plan.id ? 'var(--accent-bg)' : 'transparent' }}>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{plan.name}</div>
                  <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text2)', marginTop: 4 }}>
                    {r1(t.cal)} kcal · P {r1(t.p)}g · C {r1(t.c)}g · Fat {r1(t.fat)}g
                  </div>
                  <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 3 }}>{plan.meals.length} meals · {plan.meals.reduce((a,m) => a + m.items.length, 0)} items</div>
                </div>
              );
            })}
            {selected && (
              <div style={{ padding: '12px 16px', borderTop: '1px solid var(--border)', display: 'flex', justifyContent: 'flex-end', background: 'var(--surface2)' }}>
                <button onClick={confirm} style={{ background: 'var(--accent)', color: '#fff', border: 'none', borderRadius: 6, padding: '8px 18px', fontWeight: 600, fontSize: 13 }}>
                  Load Plan
                </button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── useDayLog ────────────────────────────────────────────────────────────────
// One day's meal log and every action on it, shared by the desktop Dashboard
// and the phone Today screen so both behave identically.
function useDayLog(log, setLog) {
  // Which day the log is showing. Defaults to today; navigable to any past/future date.
  const [viewDate, setViewDate] = useState(() => todayKey());
  const key = viewDate;
  const isToday = viewDate === todayKey();
  const meals = log[key] || [];
  const totals = sumMeals(meals);

  function shiftDay(delta) {
    setViewDate(prev => {
      const d = new Date(prev + 'T00:00:00');
      d.setDate(d.getDate() + delta);
      return localDateKey(d);
    });
  }
  function relLabel(k) {
    const t = new Date(todayKey() + 'T00:00:00');
    const d = new Date(k + 'T00:00:00');
    const diff = Math.round((d - t) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === -1) return 'Yesterday';
    if (diff === 1) return 'Tomorrow';
    const sign = diff > 0 ? '+' : '−';
    return `${d.toLocaleDateString('en-CA', { weekday: 'long' })} · ${sign}${Math.abs(diff)}d`;
  }
  function addEntry(entry) {
    if (entry.plan) {
      setLog(prev => ({ ...prev, [key]: [...(prev[key] || []), ...entry.plan.meals] }));
    } else {
      const existing = meals.find(m => m.time === entry.time);
      if (existing) {
        setLog(prev => ({
          ...prev,
          [key]: prev[key].map(m => m.time === entry.time
            ? { ...m, items: [...m.items, ...entry.items] }
            : m)
        }));
      } else {
        setLog(prev => ({ ...prev, [key]: [...(prev[key] || []), { time: entry.time, items: entry.items }] }));
      }
    }
  }

  function removeItem(mealIdx, itemIdx) {
    setLog(prev => {
      const updated = [...(prev[key] || [])];
      updated[mealIdx] = { ...updated[mealIdx], items: updated[mealIdx].items.filter((_, i) => i !== itemIdx) };
      return { ...prev, [key]: updated.filter(m => m.items.length > 0) };
    });
  }

  // Move a single food item from one slot to another. Creates the destination
  // meal if needed, merges if it exists, and drops the source meal if it empties.
  function moveItem(fromTime, itemIdx, toTime) {
    if (fromTime == null || toTime == null || fromTime === toTime) return;
    setLog(prev => {
      let dayMeals = [...(prev[key] || [])];
      const fromIdx = dayMeals.findIndex(m => m.time === fromTime);
      if (fromIdx === -1) return prev;
      const item = dayMeals[fromIdx].items[itemIdx];
      if (!item) return prev;
      // remove from source
      dayMeals = dayMeals.map(m => m.time === fromTime ? { ...m, items: m.items.filter((_, i) => i !== itemIdx) } : m);
      // add to destination (existing meal or a new one)
      const toIdx = dayMeals.findIndex(m => m.time === toTime);
      if (toIdx === -1) dayMeals.push({ time: toTime, items: [item] });
      else dayMeals = dayMeals.map(m => m.time === toTime ? { ...m, items: [...m.items, item] } : m);
      // drop any meal left with no items
      dayMeals = dayMeals.filter(m => m.items.length > 0);
      return { ...prev, [key]: dayMeals };
    });
  }

  function clearDay() {
    if (confirm(`Clear all meals for ${isToday ? 'today' : new Date(viewDate + 'T00:00:00').toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' })}?`)) setLog(prev => ({ ...prev, [key]: [] }));
  }

  // Fixed daily timeline: always render every meal slot. Foods are dragged
  // between slots; the slots themselves are static. Any legacy entry whose time
  // isn't one of the slots is shown too so no logged data is ever hidden.
  const slotValues = new Set(MEAL_SLOTS.map(s => s.value));
  const slotEntries = MEAL_SLOTS.map(s => ({ time: s.value, label: s.label, meal: meals.find(m => m.time === s.value) || null }));
  const legacyEntries = meals
    .filter(m => !slotValues.has(m.time))
    .map(m => ({ time: m.time, label: formatSlot(m.time), meal: m }));
  const timeline = [...slotEntries, ...legacyEntries].sort((a, b) => String(a.time).localeCompare(String(b.time)));

  const dateStr = new Date(viewDate + 'T00:00:00').toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' });

  return { viewDate, setViewDate, key, isToday, meals, totals, shiftDay, relLabel, addEntry, removeItem, moveItem, clearDay, timeline, dateStr };
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard({ log, goals, setLog, foodDB, recipes, stocked, setStocked }) {

  const [draggedItem, setDraggedItem] = useState(null);
  const [dragOverTime, setDragOverTime] = useState(null);
  const clearDrag = () => { setDraggedItem(null); setDragOverTime(null); };
  const { viewDate, setViewDate, key, isToday, meals, totals, shiftDay, relLabel, addEntry, removeItem, moveItem, clearDay, timeline, dateStr } = useDayLog(log, setLog);
  const dateInputRef = useRef(null);
  function openPicker() {
    const el = dateInputRef.current;

  return (
    <div className="page" style={{ padding: '28px 32px', maxWidth: 900, margin: '0 auto' }}>

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 24, gap: 16, flexWrap: 'wrap' }}>
        <div>
          <div style={{ fontSize: 11, fontFamily: 'var(--mono)', color: isToday ? 'var(--text3)' : 'var(--accent)', textTransform: 'uppercase', letterSpacing: 1 }}>{relLabel(viewDate)}</div>

              style={{ background: 'none', border: 'none', padding: '0 2px', cursor: 'pointer', display: 'flex', alignItems: 'baseline', gap: 8 }}>
              <span style={{ fontSize: 22, fontWeight: 600, color: 'var(--text)' }}>{dateStr}</span>
              <span style={{ fontSize: 13, color: 'var(--text3)' }}>▾</span>
            </button>
            <button onClick={() => shiftDay(1)} title="Next day" style={navBtnStyle}>›</button>
            {!isToday && (
              <button onClick={() => setViewDate(todayKey())}
                style={{ background: 'var(--accent-bg)', border: '1px solid var(--accent-dim)', color: 'var(--accent)', borderRadius: 6, padding: '5px 12px', fontSize: 12, fontWeight: 600, cursor: 'pointer', marginLeft: 4 }}>
                Jump to today
              </button>
            )}
            {/* Hidden native picker for arbitrary-date jumps */}
            <input ref={dateInputRef} type="date" value={viewDate}
              onChange={e => { if (e.target.value) setViewDate(e.target.value); }}
              style={{ position: 'absolute', width: 1, height: 1, opacity: 0, pointerEvents: 'none', left: 38, bottom: 0 }} />
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          {meals.length > 0 && <button onClick={clearDay} style={{ background: 'none', border: '1px solid var(--border)', borderRadius: 6, padding: '7px 14px', fontSize: 12, color: 'var(--text2)' }}>Clear</button>}
          {meals.length > 0 && <button onClick={() => setShowGrocery(true)} title="Generate grocery list" style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, padding: '7px 14px', fontSize: 12, color: 'var(--text)', display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
            🛒 Grocery list
          </button>}
          <button onClick={() => setShowModal(true)} style={{ background: 'var(--accent)', color: '#fff', border: 'none', borderRadius: 6, padding: '8px 18px', fontSize: 13, fontWeight: 600 }}>
            + Add Meal
          </button>
        </div>
      </div>

      {/* Big calorie ring + macro table */}
      <div className="dash-top" style={{ display: 'grid', gridTemplateColumns: '200px 1fr', gap: 16, marginBottom: 20 }}>
        {/* Calorie ring */}
        <div style={{ background: 'var(--surface)', borderRadius: 10, border: '1px solid var(--border)', padding: 20, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', boxShadow: 'var(--shadow)' }}>
          <CalRing value={totals.cal} target={goals.cal} />

          </div>

      <div style={{ background: 'var(--surface)', borderRadius: 10, border: '1px solid var(--border)', overflow: 'hidden', boxShadow: 'var(--shadow)' }}>
        <div style={{ padding: '14px 20px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <span style={{ fontWeight: 600, fontSize: 13 }}>Meal Log</span>

            <div key={'slot-' + entry.time}
              onDragOver={e => { if (draggedItem && draggedItem.time !== entry.time) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (dragOverTime !== entry.time) setDragOverTime(entry.time); } }}
              onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOverTime(t => t === entry.time ? null : t); }}
              onDrop={e => { if (draggedItem && draggedItem.time !== entry.time) { e.preventDefault(); moveItem(draggedItem.time, draggedItem.idx, entry.time); } clearDrag(); }}
              style={{ borderBottom: '1px solid var(--border)', background: isOver ? 'var(--accent-bg)' : 'transparent', boxShadow: isOver ? 'inset 0 0 0 1.5px var(--accent)' : 'none', transition: 'background 0.12s' }}>
              {/* Static slot header */}

                return (
                  <div key={ii}
                    draggable
                    onDragStart={e => { e.stopPropagation(); setDraggedItem({ time: entry.time, idx: ii }); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', item.name); } catch (_) {} }}
                    onDragEnd={clearDrag}
                    title="Drag this food to another time slot"
                    className="log-item"
                    style={{ padding: '9px 20px 9px 14px', display: 'grid', gridTemplateColumns: '18px 1fr 140px 60px 24px', gap: 8, alignItems: 'center', borderBottom: ii < meal.items.length - 1 ? '1px solid var(--border)' : 'none', cursor: 'grab', opacity: itemDragging ? 0.4 : 1, background: itemDragging ? 'var(--accent-bg)' : 'transparent', transition: 'opacity 0.12s' }}>
                    <span style={{ color: 'var(--text3)', fontSize: 13, lineHeight: 1, letterSpacing: -2, userSelect: 'none', textAlign: 'center' }}>⠿</span>
                    <div>
                      <span style={{ fontSize: 13 }}>{item.name}</span>
                      <span style={{ fontSize: 11, color: 'var(--text3)', marginLeft: 8, fontFamily: 'var(--mono)' }}>{item.qty || item.portion}{mult !== 1 ? ` ×${mult}` : ''}</span>
                      {item._batchServings && (
                        <span style={{ marginLeft: 6, fontSize: 10, fontFamily: 'var(--mono)', background: 'var(--accent-bg)', color: 'var(--accent)', borderRadius: 4, padding: '1px 5px', border: '1px solid var(--accent-dim)' }}>
                          1/{item._batchServings}
                        </span>
                      )}
                    </div>
                    <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--text2)', whiteSpace: 'nowrap' }}>
                      P {r1(item.p * mult)}  C {r1(item.c * mult)}  Fat {r1(item.fat * mult)}
                    </div>
                    <div style={{ fontFamily: 'var(--mono)', fontSize: 12, fontWeight: 600, textAlign: 'right', whiteSpace: 'nowrap' }}>
                      {r1(item.cal * mult)} <span style={{ fontWeight: 400, color: 'var(--text3)', fontSize: 10 }}>kcal</span>
                    </div>
                    <button onClick={() => removeItem(meals.indexOf(meal), ii)}
                      onDragStart={e => e.preventDefault()}
                      style={{ background: 'none', border: 'none', color: 'var(--text3)', fontSize: 14, cursor: 'pointer', padding: 0, textAlign: 'center' }}>×</button>
                  </div>
                );
              }) : (
                <div style={{ padding: '13px 20px', textAlign: 'center', fontSize: 11, fontFamily: 'var(--mono)', color: isOver ? 'var(--accent)' : 'var(--text3)' }}>
                  {isOver ? 'Drop food here' : 'Empty'}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {showModal && <AddMealModal onAdd={addEntry} onClose={() => setShowModal(false)} foodDB={foodDB} recipes={recipes} />}
      {showGrocery && window.GroceryList && <window.GroceryList meals={meals} foodDB={foodDB} stocked={stocked} setStocked={setStocked} dateKey={key} onClose={() => setShowGrocery(false)} />}
    </div>
  );
}

// ─── CalRing ──────────────────────────────────────────────────────────────────
function CalRing({ value, target, size = 128 }) {
  const r = 52, cx = 64, cy = 64, stroke = 9;
  const circ = 2 * Math.PI * r;
  const pct = Math.min(1, target > 0 ? value / target : 0);
  const over = value > target && target > 0;
  return (
    <svg width={size} height={size} viewBox="0 0 128 128">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--border)" strokeWidth={stroke} />
      <circle cx={cx} cy={cy} r={r} fill="none"
        stroke={over ? 'var(--red)' : 'var(--accent)'}
        strokeWidth={stroke}
        strokeDasharray={circ}
        strokeDashoffset={circ * (1 - pct)}
        strokeLinecap="round"
        transform={`rotate(-90 ${cx} ${cy})`}
        style={{ transition: 'stroke-dashoffset 0.5s ease' }}
      />
      <text x={cx} y={cy - 6} textAnchor="middle" fill="var(--text)" fontFamily="IBM Plex Mono" fontSize={18} fontWeight={600}>{r1(value)}</text>
      <text x={cx} y={cy + 10} textAnchor="middle" fill="var(--text3)" fontFamily="IBM Plex Mono" fontSize={10}>of {target}</text>
      <text x={cx} y={cy + 22} textAnchor="middle" fill="var(--text3)" fontFamily="IBM Plex Sans" fontSize={9}>kcal</text>
    </svg>
  );
}

// FoodDatabase is loaded from FoodDatabase.jsx (exported to window)
const FoodDatabase = window.FoodDatabase;

// ─── History ──────────────────────────────────────────────────────────────────
function History({ log, goals, setLog }) {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth());
  const [selected, setSelected] = useState(null);
  const [applyOpen, setApplyOpen] = useState(false);
  const [applyTargets, setApplyTargets] = useState([]); // array of YYYY-MM-DD
  const [applyMode, setApplyMode] = useState('pick'); // 'pick' | 'range'
  const [applyCalMonth, setApplyCalMonth] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [rangeStart, setRangeStart] = useState(todayKey());
  const [rangeEnd, setRangeEnd] = useState(() => { const d = new Date(); d.setDate(d.getDate() + 6); return localDateKey(d); });
  const [rangeWeekdays, setRangeWeekdays] = useState([0,1,2,3,4,5,6]); // 0=Sun
  const [overwriteMode, setOverwriteMode] = useState('add'); // 'add' | 'replace' | 'skip'
  const [applyToast, setApplyToast] = useState('');
  // On a phone the day's details sit below the calendar: bring them into view.
  const detailRef = useRef(null);
  useEffect(() => {
    if (selected && detailRef.current && window.matchMedia(PHONE_QUERY).matches) detailRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, [selected]);

  const monthName = new Date(year, month).toLocaleString('en-CA', { month: 'long', year: 'numeric' });
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  function dayKey(d) { return `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

  function prevMonth() { if (month === 0) { setYear(y => y-1); setMonth(11); } else setMonth(m => m-1); }
  function nextMonth() { if (month === 11) { setYear(y => y+1); setMonth(0); } else setMonth(m => m+1); }

  const selectedMeals = selected ? (log[dayKey(selected)] || []) : [];
  const selectedTotals = sumMeals(selectedMeals);

  // Resolved targets based on the active mode
  const resolvedTargets = React.useMemo(() => {
    if (applyMode === 'pick') return [...applyTargets].sort();
    // range mode: enumerate every day between rangeStart..rangeEnd, filtered by weekdays
    if (!rangeStart || !rangeEnd) return [];
    const a = new Date(rangeStart + 'T00:00:00');
    const b = new Date(rangeEnd + 'T00:00:00');
    if (isNaN(a) || isNaN(b)) return [];
    const [lo, hi] = a <= b ? [a, b] : [b, a];
    const out = [];
    const cur = new Date(lo);
    while (cur <= hi) {
      if (rangeWeekdays.includes(cur.getDay())) out.push(localDateKey(cur));
      cur.setDate(cur.getDate() + 1);
    }
    return out;
  }, [applyMode, applyTargets, rangeStart, rangeEnd, rangeWeekdays]);

  function toggleTarget(k) {
    setApplyTargets(prev => prev.includes(k) ? prev.filter(x => x !== k) : [...prev, k]);
  }

  function applyToDays() {
    if (!selected || selectedMeals.length === 0) return;
    const sourceKey = dayKey(selected);
    const targets = resolvedTargets.filter(k => k !== sourceKey);
    if (targets.length === 0) { setApplyToast('Pick at least one target day'); setTimeout(() => setApplyToast(''), 2200); return; }

    // Confirmation for replace mode
    if (overwriteMode === 'replace') {
      const willOverwrite = targets.filter(k => (log[k] || []).length > 0);
      if (willOverwrite.length > 0 && !confirm(`This will overwrite ${willOverwrite.length} day${willOverwrite.length === 1 ? '' : 's'} that already have meals. Continue?`)) return;
    }

    let copied = 0, skipped = 0;
    setLog(prev => {
      const next = { ...prev };
      for (const k of targets) {
        const cloned = JSON.parse(JSON.stringify(selectedMeals));
        const existing = next[k] || [];
        if (existing.length > 0) {
          if (overwriteMode === 'skip') { skipped++; continue; }
          if (overwriteMode === 'replace') next[k] = cloned;
          else next[k] = [...existing, ...cloned]; // add
        } else {
          next[k] = cloned;
        }
        copied++;
      }
      return next;
    });
    setApplyOpen(false);
    setApplyTargets([]);
    const skipMsg = skipped > 0 ? ` · skipped ${skipped}` : '';
    setApplyToast(`Copied to ${copied} day${copied === 1 ? '' : 's'}${skipMsg}`);
    setTimeout(() => setApplyToast(''), 2600);
  }

  function shiftPickFromSelected(days) {
    if (!selected) return;
    const src = new Date(year, month, selected);
    src.setDate(src.getDate() + days);
    const k = localDateKey(src);
    toggleTarget(k);
  }

  return (
    <div className="page" style={{ padding: '28px 32px', maxWidth: 960, margin: '0 auto' }}>
      <div style={{ marginBottom: 20 }}>
        <div style={{ fontSize: 11, fontFamily: 'var(--mono)', color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 1 }}>Log</div>
        <div style={{ fontSize: 22, fontWeight: 600, marginTop: 2 }}>Monthly History</div>
      </div>

      <div className="hist-grid" style={{ display: 'grid', gridTemplateColumns: selected ? '1fr 320px' : '1fr', gap: 20, alignItems: 'start' }}>
        <div style={{ background: 'var(--surface)', borderRadius: 10, border: '1px solid var(--border)', overflow: 'hidden', boxShadow: 'var(--shadow)' }}>
          {/* Month nav */}
          <div style={{ padding: '14px 20px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <button onClick={prevMonth} style={{ background: 'none', border: '1px solid var(--border)', borderRadius: 6, width: 32, height: 32, cursor: 'pointer', fontSize: 14 }}>‹</button>
            <span style={{ fontWeight: 600 }}>{monthName}</span>
            <button onClick={nextMonth} style={{ background: 'none', border: '1px solid var(--border)', borderRadius: 6, width: 32, height: 32, cursor: 'pointer', fontSize: 14 }}>›</button>
          </div>
          {/* Day names */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', padding: '10px 16px 6px' }}>
            {['Su','Mo','Tu','We','Th','Fr','Sa'].map(d => (
              <div key={d} style={{ textAlign: 'center', fontSize: 10, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 0.5 }}>{d}</div>
            ))}
          </div>
          {/* Calendar grid */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', padding: '0 16px 16px', gap: 4 }}>
            {Array(firstDay).fill(null).map((_, i) => <div key={'e'+i} />)}
            {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(d => {
              const k = dayKey(d);
              const meals = log[k] || [];
              const t = sumMeals(meals);
              const hasMeals = meals.length > 0;
              const pct = goals.cal > 0 ? t.cal / goals.cal : 0;
              const isToday = k === todayKey();
              const isSel = selected === d;
              let dotColor = 'var(--text3)';
              if (hasMeals) dotColor = pct >= 0.95 && pct <= 1.1 ? 'var(--accent)' : pct > 1.1 ? 'var(--red)' : 'var(--amber)';

              return (
                <div key={d} onClick={() => setSelected(isSel ? null : d)}
                  style={{ aspectRatio: '1', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', borderRadius: 6, cursor: 'pointer', position: 'relative',
                    background: isSel ? 'var(--accent-bg)' : isToday ? 'var(--bg)' : 'transparent',
                    border: isToday ? '1px solid var(--accent-dim)' : '1px solid transparent',
                    transition: 'background 0.15s' }}>
                  <span style={{ fontSize: 12, fontFamily: 'var(--mono)', fontWeight: isToday ? 700 : 400, color: isToday ? 'var(--accent)' : 'var(--text)' }}>{d}</span>
                  {hasMeals && (
                    <div style={{ width: 5, height: 5, borderRadius: '50%', background: dotColor, marginTop: 2 }} />
                  )}
                  {!hasMeals && <div style={{ width: 5, height: 5 }} />}
                </div>
              );
            })}
          </div>
          {/* Legend */}
          <div style={{ padding: '10px 20px', borderTop: '1px solid var(--border)', display: 'flex', gap: 16, fontSize: 10, color: 'var(--text3)', fontFamily: 'var(--mono)' }}>
            {[['var(--accent)', 'On target (95–110%)'], ['var(--amber)', 'Under target'], ['var(--red)', 'Over target']].map(([c, l]) => (
              <span key={l} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                <span style={{ width: 6, height: 6, borderRadius: '50%', background: c, display: 'inline-block' }} />{l}
              </span>
            ))}
          </div>
        </div>

        {/* Day detail */}
        {selected && (
          <div ref={detailRef} style={{ background: 'var(--surface)', borderRadius: 10, border: '1px solid var(--border)', overflow: 'hidden', boxShadow: 'var(--shadow)', scrollMarginTop: 70 }}>
            <div style={{ padding: '14px 16px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <span style={{ fontWeight: 600, fontSize: 13 }}>{new Date(year, month, selected).toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' })}</span>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                {selectedMeals.length > 0 && (
                  <button onClick={() => { setApplyTargets([]); setApplyMode('pick'); setApplyOpen(true); }}
                    style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, padding: '5px 10px', fontSize: 11, color: 'var(--text)', cursor: 'pointer', fontWeight: 500 }}>
                    Duplicate to…
                  </button>
                )}
                <button onClick={() => setSelected(null)} style={{ background: 'none', border: 'none', color: 'var(--text3)', fontSize: 16, cursor: 'pointer' }}>×</button>
              </div>
            </div>
            {selectedMeals.length === 0 ? (
              <div style={{ padding: 24, textAlign: 'center', color: 'var(--text3)', fontSize: 12 }}>No meals logged</div>
            ) : (
              <>
                <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--border)' }}>
                  <MacroTable totals={selectedTotals} goals={goals} />
                </div>
                <div style={{ overflowY: 'auto', maxHeight: 360 }}>
                  {[...selectedMeals].sort((a,b) => a.time?.localeCompare(b.time)).map((meal, mi) => (
                    <div key={mi} style={{ borderBottom: '1px solid var(--border)' }}>
                      <div style={{ padding: '8px 16px', background: 'var(--surface2)', fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600, color: 'var(--accent)' }}>{formatSlot(meal.time)}</div>
                      {meal.items.map((item, ii) => {
                        const mult = item.qty_mult !== undefined ? item.qty_mult : 1;
                        return (
                          <div key={ii} style={{ padding: '7px 16px 7px 24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: ii < meal.items.length - 1 ? '1px solid var(--border)' : 'none' }}>
                            <div>
                              <div style={{ fontSize: 12 }}>{item.name}</div>
                              <div style={{ fontSize: 10, color: 'var(--text3)', fontFamily: 'var(--mono)' }}>{item.qty || item.portion}</div>
                            </div>
                            <span style={{ fontFamily: 'var(--mono)', fontSize: 12, fontWeight: 600 }}>{r1(item.cal * mult)}</span>
                          </div>
                        );
                      })}
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        )}
      </div>

      {applyToast && (
        <div style={{ position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)', background: 'var(--text)', color: '#fff', padding: '10px 18px', borderRadius: 8, fontSize: 12, fontFamily: 'var(--mono)', boxShadow: '0 6px 20px rgba(0,0,0,0.2)', zIndex: 1600 }}>
          {applyToast}
        </div>
      )}

      {applyOpen && selected && (() => {
        const sourceKey = dayKey(selected);
        const sourceDate = new Date(year, month, selected);
        const cm = applyCalMonth;
        const cmFirst = new Date(cm.y, cm.m, 1).getDay();
        const cmDays = new Date(cm.y, cm.m + 1, 0).getDate();
        const cmName = new Date(cm.y, cm.m).toLocaleString('en-CA', { month: 'long', year: 'numeric' });
        const fmtK = k => k; // keep raw
        const targetCount = resolvedTargets.filter(k => k !== sourceKey).length;
        const conflictCount = resolvedTargets.filter(k => k !== sourceKey && (log[k] || []).length > 0).length;

        return (
        <div onClick={e => e.target === e.currentTarget && setApplyOpen(false)}
          className="modal-wrap"
          style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.45)', zIndex: 1500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
          <div className="modal-box" style={{ background: 'var(--surface)', borderRadius: 10, width: 520, maxWidth: '96vw', maxHeight: '92vh', boxShadow: '0 24px 64px rgba(0,0,0,0.22)', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
            <div style={{ padding: '14px 18px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <div style={{ fontSize: 11, fontFamily: 'var(--mono)', color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 1 }}>Duplicate day</div>
                <div style={{ fontSize: 14, fontWeight: 600, marginTop: 2 }}>
                  Copy {selectedMeals.length} meal{selectedMeals.length === 1 ? '' : 's'} from {sourceDate.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' })}
                </div>
              </div>
              <button onClick={() => setApplyOpen(false)} style={{ background: 'none', border: 'none', fontSize: 18, color: 'var(--text2)', cursor: 'pointer' }}>✕</button>
            </div>

            {/* Mode tabs */}
            <div style={{ display: 'flex', padding: '0 18px', borderBottom: '1px solid var(--border)', gap: 0 }}>
              {[['pick', 'Pick dates'], ['range', 'Date range']].map(([k, label]) => (
                <button key={k} onClick={() => setApplyMode(k)}
                  style={{ background: 'none', border: 'none', padding: '12px 14px', fontSize: 12, fontWeight: 600,
                    color: applyMode === k ? 'var(--accent)' : 'var(--text2)', cursor: 'pointer',
                    borderBottom: `2px solid ${applyMode === k ? 'var(--accent)' : 'transparent'}`, marginBottom: -1 }}>
                  {label}
                </button>
              ))}
            </div>

            <div style={{ padding: '14px 18px', overflowY: 'auto', flex: 1 }}>
              {applyMode === 'pick' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  {/* Quick shift buttons */}
                  <div>
                    <div style={{ fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 6 }}>Quick shift from source</div>
                    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                      {[-14, -7, -2, -1, 1, 2, 7, 14].map(d => {
                        const dt = new Date(sourceDate); dt.setDate(dt.getDate() + d);
                        const k = localDateKey(dt);
                        const active = applyTargets.includes(k);
                        return (
                          <button key={d} onClick={() => toggleTarget(k)}
                            style={{ padding: '5px 10px', borderRadius: 6, fontSize: 11, fontWeight: 600, fontFamily: 'var(--mono)',
                              border: `1px solid ${active ? 'var(--accent)' : 'var(--border)'}`,
                              background: active ? 'var(--accent-bg)' : 'var(--bg)',
                              color: active ? 'var(--accent)' : 'var(--text2)', cursor: 'pointer' }}>
                            {d > 0 ? `+${d}d` : `${d}d`}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Mini calendar — click to toggle */}
                  <div style={{ border: '1px solid var(--border)', borderRadius: 8, overflow: 'hidden' }}>
                    <div style={{ padding: '8px 12px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'var(--surface2)' }}>
                      <button onClick={() => setApplyCalMonth(c => c.m === 0 ? { y: c.y - 1, m: 11 } : { y: c.y, m: c.m - 1 })}
                        style={{ background: 'none', border: '1px solid var(--border)', borderRadius: 5, width: 26, height: 26, cursor: 'pointer', fontSize: 12 }}>‹</button>
                      <span style={{ fontSize: 12, fontWeight: 600 }}>{cmName}</span>
                      <button onClick={() => setApplyCalMonth(c => c.m === 11 ? { y: c.y + 1, m: 0 } : { y: c.y, m: c.m + 1 })}
                        style={{ background: 'none', border: '1px solid var(--border)', borderRadius: 5, width: 26, height: 26, cursor: 'pointer', fontSize: 12 }}>›</button>
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', padding: '6px 10px 0' }}>
                      {['Su','Mo','Tu','We','Th','Fr','Sa'].map(d => (
                        <div key={d} style={{ textAlign: 'center', fontSize: 9, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 0.5 }}>{d}</div>
                      ))}
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', padding: '4px 10px 10px', gap: 2 }}>
                      {Array(cmFirst).fill(null).map((_, i) => <div key={'e'+i} />)}
                      {Array.from({ length: cmDays }, (_, i) => i + 1).map(d => {
                        const k = `${cm.y}-${String(cm.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                        const isSource = k === sourceKey;
                        const isPicked = applyTargets.includes(k);
                        const hasLog = (log[k] || []).length > 0;
                        const isToday = k === todayKey();
                        return (
                          <button key={d} disabled={isSource} onClick={() => toggleTarget(k)}
                            style={{ aspectRatio: '1', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', borderRadius: 5,
                              cursor: isSource ? 'not-allowed' : 'pointer', position: 'relative',
                              background: isSource ? 'var(--surface2)' : isPicked ? 'var(--accent)' : isToday ? 'var(--bg)' : 'transparent',
                              border: `1px solid ${isPicked ? 'var(--accent)' : isToday ? 'var(--accent-dim)' : 'transparent'}`,
                              color: isPicked ? '#fff' : isSource ? 'var(--text3)' : 'var(--text)',
                              fontSize: 11, fontFamily: 'var(--mono)', fontWeight: isToday || isPicked ? 700 : 400,
                              opacity: isSource ? 0.5 : 1, transition: 'background 0.12s' }}>
                            {d}
                            {hasLog && !isPicked && !isSource && (
                              <div style={{ width: 4, height: 4, borderRadius: '50%', background: 'var(--amber)', marginTop: 1 }} />
                            )}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div style={{ fontSize: 10, color: 'var(--text3)', fontFamily: 'var(--mono)', display: 'flex', gap: 12 }}>
                    <span><span style={{ display: 'inline-block', width: 8, height: 8, background: 'var(--accent)', borderRadius: 2, verticalAlign: 'middle', marginRight: 4 }} />picked</span>
                    <span><span style={{ display: 'inline-block', width: 4, height: 4, background: 'var(--amber)', borderRadius: '50%', verticalAlign: 'middle', marginRight: 4 }} />has meals</span>
                    <span style={{ marginLeft: 'auto' }}>source day disabled</span>
                  </div>
                </div>
              )}

              {applyMode === 'range' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                    <div>
                      <label style={{ fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 0.5, display: 'block', marginBottom: 4 }}>From</label>
                      <input type="date" value={rangeStart} onChange={e => setRangeStart(e.target.value)}
                        style={{ width: '100%', padding: '8px 10px', border: '1px solid var(--border)', borderRadius: 6, fontSize: 13, fontFamily: 'var(--mono)', outline: 'none', background: 'var(--bg)', boxSizing: 'border-box' }} />
                    </div>
                    <div>
                      <label style={{ fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 0.5, display: 'block', marginBottom: 4 }}>To</label>
                      <input type="date" value={rangeEnd} onChange={e => setRangeEnd(e.target.value)}
                        style={{ width: '100%', padding: '8px 10px', border: '1px solid var(--border)', borderRadius: 6, fontSize: 13, fontFamily: 'var(--mono)', outline: 'none', background: 'var(--bg)', boxSizing: 'border-box' }} />
                    </div>
                  </div>

                  {/* Quick range presets */}
                  <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                    {[
                      { label: 'Next 3 days', s: 1, e: 3 },
                      { label: 'Next 6 days', s: 1, e: 6 },
                      { label: 'Next 7 days', s: 1, e: 7 },
                      { label: 'Next 14 days', s: 1, e: 14 },
                      { label: 'Past 7 days', s: -7, e: -1 },
                    ].map(({ label, s, e }) => (
                      <button key={label} onClick={() => {
                        const a = new Date(sourceDate); a.setDate(a.getDate() + s);
                        const b = new Date(sourceDate); b.setDate(b.getDate() + e);
                        setRangeStart(localDateKey(a));
                        setRangeEnd(localDateKey(b));
                      }}
                        style={{ padding: '5px 10px', borderRadius: 6, fontSize: 11, fontWeight: 600, fontFamily: 'var(--mono)',
                          border: '1px solid var(--border)', background: 'var(--bg)', color: 'var(--text2)', cursor: 'pointer' }}>
                        {label}
                      </button>
                    ))}
                  </div>

                  <div>
                    <div style={{ fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 6 }}>Weekdays</div>
                    <div style={{ display: 'flex', gap: 4 }}>
                      {['S','M','T','W','T','F','S'].map((lbl, i) => {
                        const active = rangeWeekdays.includes(i);
                        return (
                          <button key={i} onClick={() => setRangeWeekdays(prev => prev.includes(i) ? prev.filter(x => x !== i) : [...prev, i])}
                            style={{ flex: 1, padding: '6px 0', borderRadius: 5, fontSize: 11, fontWeight: 700, fontFamily: 'var(--mono)',
                              border: `1px solid ${active ? 'var(--accent)' : 'var(--border)'}`,
                              background: active ? 'var(--accent-bg)' : 'var(--bg)',
                              color: active ? 'var(--accent)' : 'var(--text3)', cursor: 'pointer' }}>
                            {lbl}
                          </button>
                        );
                      })}
                    </div>
                    <div style={{ display: 'flex', gap: 8, marginTop: 6 }}>
                      <button onClick={() => setRangeWeekdays([0,1,2,3,4,5,6])} style={{ background: 'none', border: 'none', fontSize: 10, color: 'var(--text3)', cursor: 'pointer', textDecoration: 'underline', padding: 0, fontFamily: 'var(--mono)' }}>All</button>
                      <button onClick={() => setRangeWeekdays([1,2,3,4,5])} style={{ background: 'none', border: 'none', fontSize: 10, color: 'var(--text3)', cursor: 'pointer', textDecoration: 'underline', padding: 0, fontFamily: 'var(--mono)' }}>Weekdays only</button>
                      <button onClick={() => setRangeWeekdays([0,6])} style={{ background: 'none', border: 'none', fontSize: 10, color: 'var(--text3)', cursor: 'pointer', textDecoration: 'underline', padding: 0, fontFamily: 'var(--mono)' }}>Weekends only</button>
                    </div>
                  </div>
                </div>
              )}

              {/* Conflict handling */}
              <div style={{ marginTop: 14, paddingTop: 14, borderTop: '1px solid var(--border)' }}>
                <div style={{ fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 6 }}>If target day has meals</div>
                <div style={{ display: 'flex', gap: 4 }}>
                  {[['add', 'Add on top'], ['replace', 'Replace'], ['skip', 'Skip']].map(([k, label]) => (
                    <button key={k} onClick={() => setOverwriteMode(k)}
                      style={{ flex: 1, padding: '6px 8px', borderRadius: 5, fontSize: 11, fontWeight: 600,
                        border: `1px solid ${overwriteMode === k ? 'var(--accent)' : 'var(--border)'}`,
                        background: overwriteMode === k ? 'var(--accent-bg)' : 'var(--bg)',
                        color: overwriteMode === k ? 'var(--accent)' : 'var(--text2)', cursor: 'pointer' }}>
                      {label}
                    </button>
                  ))}
                </div>
                {conflictCount > 0 && (
                  <div style={{ fontSize: 11, color: overwriteMode === 'replace' ? 'var(--red)' : 'var(--amber)',
                    background: overwriteMode === 'replace' ? 'var(--red-bg, var(--amber-bg))' : 'var(--amber-bg)',
                    padding: '8px 10px', borderRadius: 6, marginTop: 8 }}>
                    {conflictCount} target day{conflictCount === 1 ? '' : 's'} already {conflictCount === 1 ? 'has' : 'have'} meals — {overwriteMode === 'add' ? 'copied meals will be added on top' : overwriteMode === 'replace' ? 'existing meals will be overwritten' : 'these days will be skipped'}.
                  </div>
                )}
              </div>
            </div>

            {/* Summary footer */}
            <div style={{ padding: '12px 18px', borderTop: '1px solid var(--border)', background: 'var(--surface2)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
              <div style={{ fontSize: 12, color: 'var(--text2)', fontFamily: 'var(--mono)', minWidth: 0 }}>
                {targetCount === 0
                  ? <span style={{ color: 'var(--text3)' }}>No target days selected</span>
                  : <><b style={{ color: 'var(--text)' }}>{targetCount}</b> day{targetCount === 1 ? '' : 's'} · {targetCount <= 3
                      ? resolvedTargets.filter(k => k !== sourceKey).join(', ')
                      : `${resolvedTargets.filter(k => k !== sourceKey)[0]} … ${resolvedTargets.filter(k => k !== sourceKey).slice(-1)[0]}`}</>}
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                {applyMode === 'pick' && applyTargets.length > 0 && (
                  <button onClick={() => setApplyTargets([])} style={{ background: 'none', border: '1px solid var(--border)', borderRadius: 6, padding: '7px 12px', fontSize: 12, color: 'var(--text2)', cursor: 'pointer' }}>Clear</button>
                )}
                <button onClick={() => setApplyOpen(false)} style={{ background: 'none', border: '1px solid var(--border)', borderRadius: 6, padding: '7px 14px', fontSize: 12, color: 'var(--text2)', cursor: 'pointer' }}>Cancel</button>
                <button onClick={applyToDays} disabled={targetCount === 0}
                  style={{ background: targetCount === 0 ? 'var(--text3)' : 'var(--accent)', color: '#fff', border: 'none', borderRadius: 6, padding: '8px 16px', fontSize: 12, fontWeight: 600,
                    cursor: targetCount === 0 ? 'not-allowed' : 'pointer', opacity: targetCount === 0 ? 0.6 : 1 }}>
                  Copy to {targetCount || 0} day{targetCount === 1 ? '' : 's'}
                </button>
              </div>
            </div>
          </div>
        </div>
        );
      })()}
    </div>
  );
}

// ─── Goals ────────────────────────────────────────────────────────────────────
function Goals({ goals, setGoals }) {
  const [draft, setDraft] = useState({ ...goals });
  const [saved, setSaved] = useState(false);

  function save() {
    setGoals(draft);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  const fields = [
    { key: 'cal', label: 'Calories',         unit: 'kcal', hint: 'Total daily energy target' },
    { key: 'p',   label: 'Protein',          unit: 'g',    hint: 'Muscle building & satiety' },
    { key: 'c',   label: 'Carbohydrates',    unit: 'g',    hint: 'Primary energy source' },
    { key: 'f',   label: 'Dietary Fiber',    unit: 'g',    hint: 'Digestive health' },
    { key: 's',   label: 'Sugars',           unit: 'g',    hint: 'Maximum daily sugar intake' },
    { key: 'fat', label: 'Fat',              unit: 'g',    hint: 'Healthy fats target' },
  ];

  const calFromMacros = draft.p * 4 + draft.c * 4 + draft.fat * 9;

  return (
    <div className="page" style={{ padding: '28px 32px', maxWidth: 600, margin: '0 auto' }}>
      <div style={{ marginBottom: 24 }}>
        <div style={{ fontSize: 11, fontFamily: 'var(--mono)', color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 1 }}>Configuration</div>
        <div style={{ fontSize: 22, fontWeight: 600, marginTop: 2 }}>Daily Goals</div>
      </div>

      <div style={{ background: 'var(--surface)', borderRadius: 10, border: '1px solid var(--border)', overflow: 'hidden', boxShadow: 'var(--shadow)', marginBottom: 16 }}>
        {fields.map((f, i) => (
          <div key={f.key} style={{ display: 'grid', gridTemplateColumns: '1fr 140px', gap: 16, padding: '16px 20px', borderBottom: i < fields.length - 1 ? '1px solid var(--border)' : 'none', alignItems: 'center' }}>
            <div>
              <div style={{ fontWeight: 500, fontSize: 14 }}>{f.label}</div>
              <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 2 }}>{f.hint}</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <input
                type="number" value={draft[f.key]}
                onChange={e => setDraft(d => ({ ...d, [f.key]: parseFloat(e.target.value) || 0 }))}
                style={{ width: 100, padding: '8px 10px', border: '1px solid var(--border)', borderRadius: 6, fontFamily: 'var(--mono)', fontSize: 14, fontWeight: 600, textAlign: 'right', outline: 'none', background: 'var(--bg)' }}
              />
              <span style={{ fontSize: 12, color: 'var(--text3)', whiteSpace: 'nowrap' }}>{f.unit}</span>
            </div>
          </div>
        ))}
      </div>

      {/* Macro-to-calorie check */}
      <div style={{ background: calFromMacros > draft.cal * 1.05 || calFromMacros < draft.cal * 0.95 ? 'var(--amber-bg)' : 'var(--accent-bg)', borderRadius: 8, padding: '12px 16px', fontSize: 12, marginBottom: 20, border: `1px solid ${calFromMacros > draft.cal * 1.05 || calFromMacros < draft.cal * 0.95 ? 'var(--amber)' : 'var(--accent-dim)'}` }}>
        <span style={{ fontFamily: 'var(--mono)', fontWeight: 600 }}>{r1(calFromMacros)} kcal</span>
        <span style={{ color: 'var(--text2)' }}> estimated from macros (P×4 + C×4 + Fat×9) vs goal of </span>
        <span style={{ fontFamily: 'var(--mono)', fontWeight: 600 }}>{draft.cal} kcal</span>
        {Math.abs(calFromMacros - draft.cal) > draft.cal * 0.05 && (
          <span style={{ color: 'var(--amber)', marginLeft: 4 }}>— consider adjusting</span>
        )}
      </div>

      <button onClick={save} style={{ background: 'var(--accent)', color: '#fff', border: 'none', borderRadius: 8, padding: '11px 28px', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>
        {saved ? '✓ Saved' : 'Save Goals'}
      </button>
    </div>
  );
}

// ─── Sidebar ──────────────────────────────────────────────────────────────────
function Sidebar({ active, setActive, totals, goals }) {
  const calPct = goals.cal > 0 ? Math.min(100, totals.cal / goals.cal * 100) : 0;
  const over = totals.cal > goals.cal;

  const navItems = [
    { id: 'dashboard', label: 'Dashboard',     icon: '◈' },
    { id: 'food',      label: 'Food Database', icon: '⊟' },
    { id: 'history',   label: 'History',       icon: '◫' },
    { id: 'goals',     label: 'Goals',         icon: '◎' },
    { id: 'sync',      label: 'GitHub sync',   icon: '⇅' },
  ];

  return (
    <div className="sidebar" style={{ width: 220, background: 'var(--surface)', borderRight: '1px solid var(--border)', display: 'flex', flexDirection: 'column', flexShrink: 0, height: '100vh', position: 'sticky', top: 0 }}>
      {/* Logo */}
      <div style={{ padding: '24px 20px 16px', borderBottom: '1px solid var(--border)' }}>
        <div style={{ fontFamily: 'var(--mono)', fontWeight: 600, fontSize: 13, letterSpacing: -0.3, color: 'var(--text)' }}>MACRO<span style={{ color: 'var(--accent)' }}>LOG</span></div>
        <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 2, fontFamily: 'var(--mono)' }}>Bulk diet tracker</div>
      </div>

      {/* Today's calorie pill */}
      <div style={{ margin: '14px 16px', background: over ? 'var(--red-bg)' : 'var(--accent-bg)', borderRadius: 8, padding: '10px 14px', border: `1px solid ${over ? 'var(--red)' : 'var(--accent-dim)'}` }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
          <span style={{ fontSize: 10, fontFamily: 'var(--mono)', color: 'var(--text3)', textTransform: 'uppercase' }}>Today</span>
          <span style={{ fontSize: 10, fontFamily: 'var(--mono)', color: over ? 'var(--red)' : 'var(--accent)', fontWeight: 600 }}>{Math.round(calPct)}%</span>
        </div>
        <MiniBar value={totals.cal} target={goals.cal} height={5} />
        <div style={{ fontFamily: 'var(--mono)', fontSize: 11, marginTop: 6, color: 'var(--text2)' }}>
          {r1(totals.cal)} <span style={{ color: 'var(--text3)' }}>/ {goals.cal} kcal</span>
        </div>
      </div>

      {/* Nav */}
      <nav className="sidebar-nav" style={{ padding: '4px 10px', flex: 1 }}>
        {navItems.map(item => (
          <button key={item.id} onClick={() => setActive(item.id)}
            style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%', padding: '9px 12px', borderRadius: 6, border: 'none', cursor: 'pointer', textAlign: 'left', marginBottom: 2,
              background: active === item.id ? 'var(--accent-bg)' : 'transparent',
              color: active === item.id ? 'var(--accent)' : 'var(--text2)',

      {/* Quick macro summary */}
      <div className="sidebar-macros" style={{ padding: '12px 16px', borderTop: '1px solid var(--border)' }}>
        {[{k:'p',l:'Protein'},{k:'c',l:'Carbs'},{k:'fat',l:'Fat'}].map(({ k, l }) => (
          <div key={k} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
