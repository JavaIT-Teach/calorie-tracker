<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Macro Tracker: the dashboard's calorie ring on the app's green. Thick
       strokes so it still reads at 16 px in tabs and the bookmarks bar. -->
  <rect width="64" height="64" rx="14" fill="#00895a"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="9"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="80 113.1" transform="rotate(-90 32 32)"/>
  <circle cx="32" cy="32" r="5" fill="#ffffff"/>
</svg>
